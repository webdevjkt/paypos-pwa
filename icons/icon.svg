<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />

  <!-- Inner Glowing Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Modern POS Register / Card Terminal Graphic -->
  <g filter="url(#shadow)">
    <!-- Terminal Body -->
    <rect x="120" y="90" width="272" height="332" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4" />
    
    <!-- Screen Display -->
    <rect x="146" y="122" width="220" height="130" rx="18" fill="#0f172a" stroke="#475569" stroke-width="2" />
    
    <!-- Screen Content: Amount & Pulse -->
    <text x="166" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="1">PAYPOS</text>
    <text x="166" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#10b981">Rp 85.000</text>
    <circle cx="340" cy="155" r="7" fill="#10b981" />
    
    <!-- Receipt Eject Slot -->
    <line x1="180" y1="90" x2="332" y2="90" stroke="#64748b" stroke-width="6" stroke-linecap="round" />

    <!-- Paper Receipt coming out -->
    <path d="M 190 90 L 190 55 L 205 63 L 220 55 L 235 63 L 250 55 L 265 63 L 280 55 L 295 63 L 310 55 L 322 55 L 322 90 Z" fill="#f8fafc" />

    <!-- Keypad Grid (Dots) -->
    <circle cx="176" cy="285" r="14" fill="#334155" />
    <circle cx="226" cy="285" r="14" fill="#334155" />
    <circle cx="276" cy="285" r="14" fill="#334155" />
    <circle cx="326" cy="285" r="14" fill="#6366f1" />

    <circle cx="176" cy="330" r="14" fill="#334155" />
    <circle cx="226" cy="330" r="14" fill="#334155" />
    <circle cx="276" cy="330" r="14" fill="#334155" />
    <circle cx="326" cy="330" r="14" fill="#10b981" />

    <circle cx="176" cy="375" r="14" fill="#334155" />
    <circle cx="226" cy="375" r="14" fill="#334155" />
    <circle cx="276" cy="375" r="14" fill="#334155" />
    <circle cx="326" cy="375" r="14" fill="#f59e0b" />
  </g>
</svg>
